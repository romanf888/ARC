<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARC Bot - Documentation Légale</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1e1f22;
            color: #dbdee1;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #2b2d31;
            padding: 40px;
            border-radius: 12px;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        h1 {
            color: #ffffff;
            margin-bottom: 10px;
        }
        p {
            color: #b5bac1;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        a {
            display: block;
            background-color: #5865f2;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 8px;
            font-weight: 600;
            transition: background-color 0.2s;
        }
        a:hover {
            background-color: #4752c4;
        }
        footer {
            margin-top: 30px;
            font-size: 0.85em;
            color: #949ba4;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ARC - Bot Discord</h1>
        <p>Bot multifonction dédié à la sécurité des serveurs, à la modération automatisée et aux mini-jeux interactifs.</p>

        </div>

        </footer>
    </div>
</body>
</html>
